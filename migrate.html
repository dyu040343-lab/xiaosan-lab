<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>把自选带到新站 · 小散研究院</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --dim:#6e6e73; --line:#d2d2d7; --accent:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font:14px/1.65 'PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
         display:flex; justify-content:center; padding:48px 20px; }
  .wrap { width:100%; max-width:660px; }
  h1 { font-size:22px; margin:0 0 6px; letter-spacing:-.3px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:22px 22px 18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 10px; }
  p { margin:0 0 12px; color:#3a3a3c; }
  .big { font-size:34px; font-weight:700; color:var(--accent); letter-spacing:-1px; }
  .big span { font-size:13px; font-weight:400; color:var(--dim); margin-left:6px; letter-spacing:0; }
  .codes { max-height:150px; overflow:auto; background:var(--bg); border:1px solid var(--line);
           border-radius:8px; padding:10px 12px; font:12px/1.7 'SFMono-Regular',Consolas,monospace;
           color:#3a3a3c; word-break:break-all; margin:10px 0 14px; }
  button { font:inherit; cursor:pointer; border-radius:9px; padding:10px 18px;
           border:1px solid var(--line); background:#fff; color:var(--text); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; margin-right:8px; }
  button:hover { opacity:.9; }
  textarea { width:100%; height:76px; border:1px solid var(--line); border-radius:8px;
             padding:9px 11px; font:12px/1.6 'SFMono-Regular',Consolas,monospace; resize:vertical; }
  a { color:var(--accent); }
  .warn { background:#fdf6ec; border:1px solid #f0d9b5; border-radius:10px; padding:12px 14px;
          font-size:12.5px; color:#7a4a12; margin-bottom:16px; }
  .muted { color:var(--dim); font-size:12px; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>小散研究院 · 把自选带到新站</h1>
  <div class="sub">这个页面只做一件事：把你在旧地址（<code>43.129.201.84:8080</code>）存下的自选，搬到新站。</div>

  <div class="wrap" id="app"></div>

  <p class="muted">新站地址：<a href="https://xiaosanlab.online/retail-radar.html">https://xiaosanlab.online/retail-radar.html</a></p>
</div>

<script>
const KEY = 'xiaosan_watchlist_v1';           // 与站点一致
const NEW_SITE = 'https://xiaosanlab.online/retail-radar.html';

function readOld() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || '[]');
    return Array.isArray(v) ? v.filter(x => typeof x === 'string' && /^\d{6}$/.test(x)) : [];
  } catch (e) { return []; }
}
function otherKeys() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('xiaosan') >= 0 && k !== KEY) out.push(k);
    }
  } catch (e) {}
  return out;
}
function go(codes) {
  location.href = NEW_SITE + '?w=' + codes.join(',');
}

const codes = readOld();
const app = document.getElementById('app');

if (codes.length) {
  app.innerHTML =
    '<div class="card">' +
      '<h2>找到你的自选</h2>' +
      '<div class="big">' + codes.length + '<span>只</span></div>' +
      '<div class="codes">' + codes.join(' ') + '</div>' +
      '<button class="primary" id="btnGo">带到新站 →</button>' +
      '<button id="btnCopy">复制代码</button>' +
      '<p class="muted" style="margin-top:14px">点「带到新站」会在新站地址里带上这些代码，打开后自动恢复并保存。</p>' +
    '</div>';
  document.getElementById('btnGo').onclick = () => go(codes);
  document.getElementById('btnCopy').onclick = () => {
    const t = codes.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t)
      .then(() => alert('已复制 ' + codes.length + ' 只代码'))
      .catch(() => prompt('复制下面的代码：', t));
    else prompt('复制下面的代码：', t);
  };
} else {
  app.innerHTML =
    '<div class="card">' +
      '<h2>这个地址没有找到自选</h2>' +
      '<div class="warn">' +
        '说明：自选存在<b>浏览器本机</b>，而且是<b>按网址隔离</b>的。' +
        '如果你现在的自选是在别处加的（比如已经用新站加过、或换了浏览器/设备），这个页面就读不到。' +
      '</div>' +
      '<p>如果你手上有导出的代码文本，粘在下面，我直接带到新站：</p>' +
      '<textarea id="ta" placeholder="600519 000001 601857 …（换行、逗号、空格都行）"></textarea>' +
      '<p style="margin-top:12px"><button class="primary" id="btnGo2">带到新站 →</button>' +
      '<button id="btnNew">直接去新站</button></p>' +
      (otherKeys().length ? '<p class="muted">本地址下还发现这些相关存储：<code>' + otherKeys().join('</code> <code>') + '</code></p>' : '') +
    '</div>';
  document.getElementById('btnGo2').onclick = () => {
    const list = (document.getElementById('ta').value || '').split(/[\s,，;；]+/)
      .map(x => x.trim()).filter(x => /^\d{6}$/.test(x));
    if (!list.length) { alert('没有识别到 6 位股票代码'); return; }
    go(list);
  };
  document.getElementById('btnNew').onclick = () => { location.href = NEW_SITE; };
}
</script>
</body>
</html>
